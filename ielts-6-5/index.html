{id:"g1",l:1,t:"Present Simple vs Present Continuous",r:"Present Simple — факты, привычки, расписание: I work in Astana. I meditate every morning.\nPresent Continuous — действие сейчас или временный период: I am preparing for IELTS this year.\nГлаголы состояния (know, believe, want, understand) обычно не идут в Continuous.",trap:"По-русски одно время «я работаю». В английском выбирайте: постоянно (I work) или сейчас/временно (I am working).",q:[{q:"I ___ for the IELTS exam this year.",o:["prepare","am preparing","prepares","prepared"],a:1,e:"Временный период «в этом году» → Present Continuous."},{q:"She usually ___ coffee in the morning.",o:["drinks","is drinking","drink","drinking"],a:0,e:"Привычка + usually → Present Simple, 3-е лицо -s."},{q:"I ___ what you mean.",o:["am understanding","understand","understands","am understand"],a:1,e:"understand — глагол состояния, без -ing."},{q:"Look! The coach ___ to the team.",o:["talks","is talking","talk","talked"],a:1,e:"Look! — действие прямо сейчас."}]},
{id:"g2",l:1,t:"Past Simple vs Present Perfect",r:"Past Simple — законченное действие с указанием времени: I graduated in 1998.\nPresent Perfect — опыт или результат без точного времени, связь с настоящим: I have worked as a coach for 13 years.\nМаркеры Perfect: ever, never, already, yet, since, for (до сих пор).",trap:"«Я работаю коучем 13 лет» = I have worked / have been working... НЕ «I work as a coach 13 years».",q:[{q:"I ___ as a coach for 13 years.",o:["work","worked","have worked","am working"],a:2,e:"Действие длится до сих пор → Present Perfect + for."},{q:"We ___ the forum in Almaty in 2024.",o:["have organised","organised","organise","have organise"],a:1,e:"Точная дата → Past Simple."},{q:"Have you ever ___ to the USA?",o:["be","been","was","went"],a:1,e:"have + been (3-я форма)."},{q:"She hasn't finished the report ___.",o:["already","yet","ago","since"],a:1,e:"yet — в отрицаниях и вопросах в конце."}]},
{id:"g3",l:1,t:"Артикли a / an / the",r:"a/an — один из многих, впервые упоминаем: I have an idea.\nthe — конкретный, известный обоим: The idea you shared was brilliant.\nБез артикля — общее понятие во множественном или неисчисляемое: Leaders need courage.",trap:"Главная ошибка русскоговорящих — пропуск артикля. Перед исчисляемым существительным в единственном числе артикль нужен почти всегда.",q:[{q:"She is ___ executive coach.",o:["a","an","the","—"],a:1,e:"executive начинается с гласного звука → an."},{q:"___ university I want to enter is in Iowa.",o:["A","An","The","—"],a:2,e:"Конкретный университет, уточнён придаточным → the."},{q:"___ leadership is a skill that can be learned.",o:["A","The","An","—"],a:3,e:"Абстрактное понятие в общем смысле → без артикля."},{q:"I read ___ interesting article yesterday.",o:["a","an","the","—"],a:1,e:"Первое упоминание + гласный звук → an."}]},
{id:"g4",l:1,t:"Сравнение прилагательных",r:"Короткие: fast → faster → the fastest.\nДлинные: effective → more effective → the most effective.\nИсключения: good → better → the best; bad → worse → the worst.\nas ... as — так же, как: This task is as important as that one.",trap:"Не говорите «more better» — better уже сравнительная степень.",q:[{q:"Speaking is ___ than reading for me.",o:["more difficult","difficulter","most difficult","more difficulter"],a:0,e:"Длинное прилагательное → more."},{q:"This is ___ book on coaching I have read.",o:["the better","the best","best","the most good"],a:1,e:"good → the best."},{q:"My English is ___ than last year.",o:["more better","gooder","better","best"],a:2,e:"good → better."}]},
{id:"g5",l:2,t:"Present Perfect Continuous",r:"have/has been + V-ing — процесс, который начался в прошлом и продолжается (акцент на длительности): I have been studying English since October.\nЧасто с for / since / how long.",trap:"«Я учу английский с октября» = I have been studying English since October. Не Present Simple!",q:[{q:"I ___ English since October.",o:["study","am studying","have been studying","studied"],a:2,e:"since + процесс до сих пор → Perfect Continuous."},{q:"How long ___ you been meditating?",o:["do","have","are","did"],a:1,e:"How long have you been...?"},{q:"She is tired because she ___ all day.",o:["has been working","works","worked","is work"],a:0,e:"Видимый результат длительного процесса."}]},
{id:"g6",l:2,t:"Будущее: will / going to / Present Continuous",r:"will — решение в момент речи, прогноз, обещание: I will help you.\ngoing to — план, намерение: I am going to apply to MIU.\nPresent Continuous — договорённость: I am meeting my tutor on Monday.",trap:"Для заранее принятых планов лучше going to, а не will.",q:[{q:"I have decided. I ___ apply for the PhD next year.",o:["will","am going to","apply","applying"],a:1,e:"Заранее принятое решение → going to."},{q:"The phone is ringing. — I ___ answer it.",o:["am going to","will","answer","am answering"],a:1,e:"Спонтанное решение → will."},{q:"I ___ my tutor at 10 tomorrow. It is in my calendar.",o:["meet","will meet","am meeting","met"],a:2,e:"Договорённость → Present Continuous."}]},
{id:"g7",l:2,t:"Модальные глаголы: must / have to / should",r:"must — внутренняя необходимость, правило: I must practise every day.\nhave to — внешняя необходимость: Applicants have to submit IELTS scores.\nshould — совет: You should read every day.\nmustn't — запрещено; don't have to — не обязательно.",trap:"mustn't ≠ don't have to. You mustn't be late = нельзя. You don't have to come = можно не приходить.",q:[{q:"Applicants ___ submit an IELTS certificate.",o:["have to","should to","musts","has to"],a:0,e:"Внешнее требование университета → have to."},{q:"You ___ smoke here. It is forbidden.",o:["don't have to","mustn't","shouldn't to","needn't"],a:1,e:"Запрет → mustn't."},{q:"You look tired. You ___ rest.",o:["should","must to","have","ought"],a:0,e:"Совет → should."}]},
{id:"g8",l:2,t:"Условные предложения 1 и 2 типа",r:"1 тип (реальное будущее): If + Present, will + V: If I practise daily, I will get 6.5.\n2 тип (нереальное настоящее): If + Past, would + V: If I had more time, I would study more.",trap:"После if не ставим will: If I will pass → If I pass.",q:[{q:"If I ___ every day, I will reach band 6.5.",o:["will practise","practise","practised","would practise"],a:1,e:"1 тип: if + Present Simple."},{q:"If I ___ in the USA, I would speak better.",o:["live","lived","will live","living"],a:1,e:"2 тип: if + Past."},{q:"If she gets the scholarship, she ___ to Iowa.",o:["would move","moves","will move","moved"],a:2,e:"1 тип: will + V."}]},
{id:"g9",l:3,t:"Пассивный залог",r:"be + V3: The study was conducted in 2020.\nИспользуется в академическом английском, когда важен результат, а не исполнитель.\nPresent: is done; Past: was done; Perfect: has been done; Future: will be done.",trap:"Не забывайте to be: «The research conducted» → The research was conducted.",q:[{q:"The data ___ by survey in 2025.",o:["collected","was collected","has collected","is collect"],a:1,e:"Past Simple Passive: was + V3."},{q:"Many studies ___ on mindfulness since 2000.",o:["have been published","were publish","has published","published"],a:0,e:"since → Present Perfect Passive."},{q:"The results ___ next month.",o:["will announce","will be announced","are announce","announced"],a:1,e:"Future Passive."}]},
{id:"g10",l:3,t:"Придаточные определительные (who/which/that/whose)",r:"who — люди; which — предметы; that — люди и предметы (в определяющих); whose — чей.\nDefining: The coach who trained me is from London.\nNon-defining (с запятыми, без that): MIU, which is in Iowa, offers a PhD.",trap:"В придаточных с запятыми нельзя использовать that.",q:[{q:"MIU, ___ is located in Iowa, offers a PhD.",o:["that","which","who","what"],a:1,e:"Запятые → which, не that."},{q:"The leader ___ inspired me was my first boss.",o:["which","who","whose","whom"],a:1,e:"Человек → who."},{q:"She is a coach ___ clients are CEOs.",o:["who","whose","which","that"],a:1,e:"Принадлежность → whose."}]},
{id:"g11",l:3,t:"Косвенная речь",r:"Время сдвигается назад: She said, 'I am tired.' → She said (that) she was tired.\nwill → would; can → could; Present Perfect → Past Perfect.\nВопросы — прямой порядок слов: He asked where I lived.",trap:"В косвенном вопросе нет инверсии: He asked where did I live → He asked where I lived.",q:[{q:"She said she ___ busy.",o:["is","was","will","be"],a:1,e:"am → was."},{q:"He asked me where ___.",o:["did I work","I worked","do I work","I work did"],a:1,e:"Прямой порядок слов."},{q:"They said they ___ help us.",o:["will","would","can will","are"],a:1,e:"will → would."}]},
{id:"g12",l:3,t:"Условные 3 типа и смешанные",r:"3 тип (нереальное прошлое): If + had V3, would have V3: If I had started earlier, I would have finished.\nСмешанный: If I had learned English as a child, I would be fluent now.",trap:"Не путайте would have done (прошлое) и would do (настоящее).",q:[{q:"If I had known, I ___ you.",o:["would tell","would have told","told","will tell"],a:1,e:"3 тип → would have + V3."},{q:"If she ___ harder, she would have passed.",o:["studied","had studied","has studied","would study"],a:1,e:"3 тип: if + had V3."},{q:"If I had moved to London, I ___ fluent now.",o:["would be","would have been","am","will be"],a:0,e:"Смешанный: результат в настоящем."}]},
{id:"g13",l:4,t:"Связки и контраст",r:"Контраст: however, whereas, while, although, despite + noun/V-ing, in spite of.\nДобавление: moreover, furthermore, in addition.\nПричина/следствие: therefore, as a result, consequently, due to + noun.",trap:"despite the fact that... или despite + существительное. Не «despite of».",q:[{q:"___ the rain, the forum went ahead.",o:["Although","Despite","However","Despite of"],a:1,e:"Despite + noun."},{q:"Coaching is popular in the USA, ___ it is new in Kazakhstan.",o:["whereas","despite","therefore","moreover"],a:0,e:"Сравнение-контраст двух частей → whereas."},{q:"The sample was small. ___, the results must be treated with caution.",o:["However","Therefore","Whereas","Although"],a:1,e:"Следствие → Therefore."}]},
{id:"g14",l:4,t:"Академический стиль: номинализация",r:"Превращайте глаголы в существительные — так текст звучит академично:\nWe analysed the data → The analysis of the data showed...\nPeople participated → Participation increased.\nИзбегайте сокращений (don't → do not) и разговорных слов (a lot of → a significant number of).",trap:"В Writing и в мотивационном письме избегайте «a lot of», «get», «thing».",q:[{q:"Выберите академичный вариант:",o:["We got a lot of results.","A substantial number of results were obtained.","We got lots of stuff.","Results was many."],a:1,e:"Номинализация + пассив + точная лексика."},{q:"Существительное от «improve»:",o:["improving","improvement","improval","improvance"],a:1,e:"improve → improvement."},{q:"Существительное от «analyse»:",o:["analysation","analysis","analysement","analyzing"],a:1,e:"analyse → analysis (мн. analyses)."}]},
{id:"g15",l:4,t:"Герундий или инфинитив",r:"После enjoy, avoid, consider, suggest, finish — V-ing: I enjoy coaching.\nПосле want, decide, plan, hope, agree — to V: I decided to apply.\nПосле предлогов — всегда V-ing: interested in studying.\nstop doing (прекратить) ≠ stop to do (остановиться, чтобы).",trap:"«Я заинтересована изучать» = I am interested in studying, не «interested to study».",q:[{q:"I am interested in ___ leadership.",o:["study","to study","studying","studied"],a:2,e:"После предлога → V-ing."},{q:"She decided ___ for a PhD.",o:["applying","to apply","apply","applied"],a:1,e:"decide + to V."},{q:"We should avoid ___ too many questions.",o:["to ask","asking","ask","asked"],a:1,e:"avoid + V-ing."}]},
{id:"g16",l:5,t:"Инверсия для усиления",r:"Отрицательное наречие в начале → порядок как в вопросе:\nNever have I seen such commitment.\nNot only does coaching improve performance, but it also increases well-being.\nRarely do leaders admit mistakes.",trap:"Это приём для Band 7+: используйте 1–2 раза за ответ, не чаще.",q:[{q:"Never ___ such a motivated team.",o:["I have seen","have I seen","I saw","did I saw"],a:1,e:"Never + have I seen."},{q:"Not only ___ meditation reduce stress, but it also improves focus.",o:["does","do","is","it"],a:0,e:"Not only does + подлежащее + V."},{q:"Rarely ___ leaders admit their mistakes.",o:["do","are","does","have"],a:0,e:"Rarely do + подлежащее во мн. числе."}]},
{id:"g17",l:5,t:"Хеджирование (осторожные формулировки)",r:"Академический английский избегает категоричности:\nIt appears that..., This may suggest..., It is likely that..., tend to, to some extent, arguably.\nThe results suggest that meditation may enhance focus.",trap:"Русская привычка к категоричным выводам («это доказывает») звучит в академическом английском слишком сильно. Лучше: This suggests...",q:[{q:"Наиболее академичная формулировка:",o:["This proves meditation works.","The findings suggest that meditation may be beneficial.","Meditation is 100% good.","Everyone knows meditation works."],a:1,e:"suggest + may — хеджирование."},{q:"Leaders ___ to underestimate the role of rest.",o:["tend","are tend","tending","tends"],a:0,e:"tend to + V."},{q:"Выберите хедж:",o:["certainly","to some extent","always","definitely"],a:1,e:"to some extent смягчает утверждение."}]}
];

{id:"r1",l:1,t:"The Power of Morning Routines",p:"Many successful people start their day with a routine. Some of them wake up early, drink water and spend a few minutes in silence. Others write a list of goals for the day.\n\nResearchers believe that a morning routine helps people feel more in control. When the first hour of the day is calm, it is easier to make good decisions later. However, a routine does not have to be long. Even ten minutes can make a difference.\n\nExperts also say that the best routine is the one you can repeat every day. Consistency is more important than perfection.",q:[{q:"A morning routine must last at least one hour.",o:["True","False","Not Given"],a:1},{q:"Researchers think routines help people feel in control.",o:["True","False","Not Given"],a:0},{q:"Most successful people wake up at 5 a.m.",o:["True","False","Not Given"],a:2},{q:"According to experts, what matters most?",o:["Perfection","Waking early","Consistency","Silence"],a:2}]},
{id:"r2",l:2,t:"What Makes a Good Coach?",p:"Coaching has become one of the fastest-growing professions in the world. But what makes a coach effective? According to several professional associations, the most important skill is not giving advice but asking powerful questions.\n\nA good coach listens actively. This means paying attention not only to the client's words but also to their emotions and body language. Coaches also need to create a safe space where clients can speak honestly.\n\nFinally, effective coaches hold their clients accountable. They help clients turn insights into concrete actions and check progress regularly. Without accountability, even the best ideas may never become reality.",q:[{q:"The main skill of a coach is giving good advice.",o:["True","False","Not Given"],a:1},{q:"Active listening includes noticing body language.",o:["True","False","Not Given"],a:0},{q:"Coaching is the fastest-growing profession in Europe.",o:["True","False","Not Given"],a:2},{q:"Accountability helps clients to...",o:["relax","turn insights into action","find a new job","speak honestly"],a:1}]},
{id:"r3",l:3,t:"Meditation in the Workplace",p:"Over the past two decades, a significant number of companies have introduced meditation programmes for their employees. The rationale is simple: stress is costly. It reduces productivity, increases absenteeism and contributes to burnout.\n\nStudies of workplace meditation have reported improvements in concentration, emotional regulation and job satisfaction. Some organisations offer short guided sessions during lunch breaks, while others invest in longer training programmes.\n\nCritics, however, warn that meditation should not be used as a quick fix. If the causes of stress lie in poor management or unrealistic workloads, meditation alone cannot solve the problem. The most successful programmes, they argue, combine individual practice with changes in organisational culture.",q:[{q:"Stress has financial costs for companies.",o:["True","False","Not Given"],a:0},{q:"All companies offer meditation during lunch breaks.",o:["True","False","Not Given"],a:1},{q:"Meditation programmes are cheaper than salary increases.",o:["True","False","Not Given"],a:2},{q:"According to critics, the best programmes...",o:["replace management","combine practice with culture change","are very short","focus only on individuals"],a:1}]},
{id:"r4",l:4,t:"From Traits to Consciousness: Theories of Leadership",p:"Early leadership research focused on traits: scholars attempted to identify the inherent qualities, such as intelligence or confidence, that distinguished leaders from followers. This approach was gradually abandoned when empirical studies failed to find a consistent set of traits.\n\nIn the second half of the twentieth century, attention shifted to behaviour and context. Situational models proposed that effective leaders adapt their style to the readiness of their team. Later, transformational leadership emphasised vision, inspiration and the intellectual stimulation of followers.\n\nMore recent paradigms, including authentic and consciousness-based leadership, place the inner development of the leader at the centre. Proponents argue that self-awareness and inner stability underpin sound decision-making, although researchers note that these constructs remain difficult to measure quantitatively.",q:[{q:"Trait theory was abandoned because no consistent traits were found.",o:["True","False","Not Given"],a:0},{q:"Situational models say leaders should keep one fixed style.",o:["True","False","Not Given"],a:1},{q:"Transformational leadership was developed in Japan.",o:["True","False","Not Given"],a:2},{q:"What limitation of recent paradigms is mentioned?",o:["They ignore vision","They are hard to measure quantitatively","They reject self-awareness","They are too old"],a:1}]},
{id:"r5",l:5,t:"Consciousness-Based Education",p:"Consciousness-Based Education is an approach in which the development of the student's inner awareness is treated as a foundation for academic learning. In institutions that follow this model, students typically practise a meditation technique twice a day and study in a block system, focusing on one course at a time.\n\nSupporters maintain that this structure reduces cognitive overload and fosters deeper engagement with each subject. They point to studies reporting reduced anxiety and improved academic performance among participants.\n\nSceptics, by contrast, call for more rigorous, independent replication, observing that some studies have been conducted by researchers affiliated with the institutions concerned. The debate illustrates a broader challenge in educational research: how to evaluate holistic outcomes such as well-being, creativity and character, which resist simple measurement.",q:[{q:"Students in this model usually study several courses at the same time.",o:["True","False","Not Given"],a:1},{q:"Sceptics want more independent studies.",o:["True","False","Not Given"],a:0},{q:"The block system was invented in 1971.",o:["True","False","Not Given"],a:2},{q:"The broader challenge is how to...",o:["teach meditation","measure holistic outcomes","reduce fees","hire researchers"],a:1}]}
];

const allWords=()=>{const out=[];for(let l=1;l<=5;l++)V[l].forEach((w,i)=>out.push({id:"L"+l+"-"+i,en:w[0],ru:w[1],ex:w[2],cat:w[3],l}));st.custom.forEach((w,i)=>out.push({id:"c-"+i,en:w.en,ru:w.ru,ex:w.ex||"",cat:"c",l:0,own:true}));return out};
const wordById=id=>allWords().find(w=>w.id===id);

function day(k=todayKey()){if(!st.days[k])st.days[k]={morning:false,steps:[],newWords:[],learned:0};return st.days[k]}
function ensureNewWords(){const d=day();if(d.newWords.length)return d.newWords;const pool=unlockedWords().filter(w=>!st.words[w.id]);const own=pool.filter(w=>w.own);const rest=pool.filter(w=>!w.own);d.newWords=own.concat(rest).slice(0,st.newPerDay).map(w=>w.id);save();return d.newWords}
const dueWords=()=>{const t=todayKey();return Object.entries(st.words).filter(([id,s])=>s.due<=t&&wordById(id)).map(([id])=>id)};
function grade(id,know){const s=st.words[id]||{box:0,due:todayKey()};s.box=know?Math.min(s.box+1,6):1;s.due=addDays(todayKey(),INT[s.box]);st.words[id]=s;if(know)day().learned++;save()}
function streak(){let k=todayKey(),n=0;if(!day(k).morning)k=addDays(k,-1);while(st.days[k]&&st.days[k].morning){n++;k=addDays(k,-1)}return n}

function pickReading(){const av=R.filter(r=>r.l<=st.unlocked);const nd=av.filter(r=>st.reading[r.id]==null);return nd.length?nd[nd.length-1]:av[dayIdx()%av.length]}

function vSession(){

 return `<section class="card"><input type="text" id="dictQ" placeholder="Поиск по английскому или русскому" value="${esc(ui.dictQ)}">
 <div class="seg">${[["all","Все"],["b","Бизнес"],["a","Академ."],["c","Коучинг"],["own","Мои"]].map(([k,n])=>`<button data-dc="${k}" aria-pressed="${ui.dictCat===k}">${n}</button>`).join("")}</div>
 <div class="list">${ws.map(w=>{const s=st.words[w.id];return `<div class="li"><button class="speak" data-say="${esc(w.en)}" aria-label="Произношение">▶</button><div class="grow"><b>${esc(w.en)}</b> — ${esc(w.ru)}<div class="small muted ex">${esc(w.ex)}</div></div><span class="chip ${s?(s.box>=4?"c-sage":"c-lav"):"c-rose"}">${s?(s.box>=4?"выучено":"учу"):"новое"}</span></div>`}).join("")||'<p class="muted">Ничего не найдено.</p>'}</div>
 <p class="small muted">Открыто слов: ${unlockedWords().length}. Следующий этап добавит 20 новых.</p></section>`;
}
function vAdd(){return `<section class="card"><h3>Добавить своё слово</h3><p class="small muted">Слова из статей, вебинаров, переписки с университетом. Ваши слова идут в «Слова дня» первыми.</p>
 <input type="text" id="aEn" placeholder="Английское слово или фраза"><input type="text" id="aRu" placeholder="Перевод на русский"><input type="text" id="aEx" placeholder="Пример предложения (необязательно)">
 <div class="row"><button class="btn" data-act="addWord">Добавить</button></div>
 ${st.custom.length?`<div class="list">${st.custom.map(w=>`<div class="li"><div class="grow"><b>${esc(w.en)}</b> — ${esc(w.ru)}</div></div>`).join("")}</div>`:""}</section>`}
after.words=()=>{const i=$("#dictQ");if(i){i.addEventListener("input",e=>{ui.dictQ=e.target.value;const pos=e.target.selectionStart;render();const n=$("#dictQ");n.focus();n.setSelectionRange(pos,pos)})}};

/* --- Грамматика --- */
function vGrammar(){
 if(ui.gTopic){const g=G.find(x=>x.id===ui.gTopic);return `<button class="btn ghost sm" data-act="gBack" style="align-self:flex-start">← Все темы</button>${blockGrammar(g,"gg")}`}
 return `<section><h2>Грамматика</h2><p class="muted small" style="margin-top:4px">Правила на русском, примеры из коучинга и лидерства, типичные ошибки русскоговорящих.</p></section>
 ${STAGES.map(s=>`<section class="card ${s.n>st.unlocked?"lock":""}"><div class="row" style="justify-content:space-between"><h3>${s.cefr} · ${s.name}</h3>${s.n>st.unlocked?'<span class="chip c-rose">откроется после теста</span>':""}</div>
 <div class="list">${G.filter(g=>g.l===s.n).map(g=>{const sc=st.grammar[g.id];return `<div class="li"><div class="grow"><b>${esc(g.t)}</b></div>${sc!=null?`<span class="chip ${sc>=75?"c-sage":"c-peach"}">${sc}%</span>`:""}${s.n<=st.unlocked?`<button class="btn sm soft" data-gt="${g.id}">Открыть</button>`:""}</div>`}).join("")}</div></section>`).join("")}`;
}
after.grammar=()=>{if(ui.gTopic)regGrammar(G.find(x=>x.id===ui.gTopic),"gg")};

/* --- Речь --- */
function vSpeak(){const av=availS();const x=av[ui.sIdx%av.length];return `<section><h2>Разговорная речь</h2><p class="muted small" style="margin-top:4px">IELTS Speaking Part 1, 2, 3 и интервью для поступления. Говорите вслух, засекайте время, проверяйте себя по 4 критериям.</p></section>
 <div class="seg">${av.map((s,i)=>`<button data-si="${i}" aria-pressed="${i===ui.sIdx%av.length}">${s.part}: ${esc(s.t.length>26?s.t.slice(0,24)+"…":s.t)}</button>`).join("")}</div>${blockSpeak(x)}`}

/* --- Перевод --- */
function vTrans(){const av=availT();const start=(ui.tIdx*3)%av.length;const items=[0,1,2].map(i=>av[(start+i)%av.length]);ui.trItems=items;return `<section><h2>Перевод RU → EN</h2><p class="muted small" style="margin-top:4px">Предложения из вашей реальной жизни и будущего PhD. Всего переведено: ${st.trans}.</p></section>${blockTrans(items)}<div class="row"><button class="btn soft" data-act="nextTr">Следующие 3 предложения</button></div>`}

/* --- Чтение --- */
function vRead(){
 if(ui.rId){const r=R.find(x=>x.id===ui.rId);return `<button class="btn ghost sm" data-act="rBack" style="align-self:flex-start">← Все тексты</button>${blockReading(r,"rr")}`}
 return `<section><h2>Чтение</h2><p class="muted small" style="margin-top:4px">Академические тексты о коучинге, лидерстве и осознанности в формате IELTS Academic.</p></section>
 <section class="card"><div class="list">${R.map(r=>{const sc=st.reading[r.id];const lock=r.l>st.unlocked;return `<div class="li"><div class="grow"><b>${esc(r.t)}</b><div class="small muted">${STAGES[r.l-1].cefr} · ${r.p.split(/\s+/).length} слов</div></div>${sc!=null?`<span class="chip ${sc>=75?"c-sage":"c-peach"}">${sc}%</span>`:""}${lock?'<span class="chip c-rose">закрыто</span>':`<button class="btn sm soft" data-ri="${r.id}">Читать</button>`}</div>`}).join("")}</div></section>`;
}
after.read=()=>{if(ui.rId)regReading(R.find(x=>x.id===ui.rId),"rr")};

/* --- Этапы и тесты --- */
function vStages(){
 if(ui.test)return vTest();
 const dates=stageDates();
 return `<section><h2>Дорожная карта до августа 2027</h2><p class="muted small" style="margin-top:4px">5 этапов, ${STAGES.reduce((a,s)=>a+s.weeks,0)} недель. Каждый тест этапа: 12 вопросов (слова + грамматика), проходной балл 70%. Успешный тест открывает новые слова, темы, тексты и задания.</p></section>
 <div class="ladder">${STAGES.map((s,i)=>{const t=st.tests[s.n];const lock=s.n>st.unlocked;const now=s.n===st.unlocked;return `<div class="lvl ${lock?"lock":""} ${now?"now":""}"><div class="band">${s.band}</div><div style="min-width:0"><div class="row"><b>${s.n}. ${s.name}</b><span class="chip c-lav">${s.cefr}</span>${t?`<span class="chip ${t.best>=70?"c-sage":"c-peach"}">тест ${t.best}%</span>`:""}</div><div class="small">${s.goal}</div><div class="small muted">${fmt(dates[i].from)} — ${fmt(dates[i].to)} · ${s.weeks} нед.</div></div><div>${lock?'<span class="chip c-rose">закрыт</span>':`<button class="btn sm ${now?"":"soft"}" data-test="${s.n}">${t?"Пересдать":"Пройти тест"}</button>`}</div></div>`}).join("")}</div>
 <section class="soft"><div class="eyebrow">Как читать шкалу</div><p class="small">Band — ориентир по шкале IELTS для каждого этапа. Цель поступления — общий балл 6.5. Этап 5 даёт запас на случай, если один из модулей (обычно Writing или Speaking) окажется ниже.</p></section>`;
}
function makeTest(n){const ws=allWords().filter(w=>w.l===n);const pool=unlockedWords();const qs=[];
 shuffle(ws).slice(0,4).forEach(w=>{const o=shuffle([w.ru,...shuffle(pool.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.ru)]);qs.push({q:"Перевод: "+w.en,o,a:o.indexOf(w.ru),e:w.ex})});
 shuffle(ws).slice(0,3).forEach(w=>{const re=new RegExp(w.en.replace(/[-]/g,"\\-"),"i");const gap=w.ex.replace(re,"_____");const o=shuffle([w.en,...shuffle(ws.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.en)]);qs.push({q:gap,o,a:o.indexOf(w.en),e:w.ex})});
 shuffle(G.filter(g=>g.l===n).flatMap(g=>g.q)).slice(0,5).forEach(q=>qs.push(q));return shuffle(qs)}
function vTest(){const n=ui.test.n,s=STAGES[n-1];return `<button class="btn ghost sm" data-act="testBack" style="align-self:flex-start">← К этапам</button><section class="card"><div class="eyebrow">Тест этапа ${n}</div><h2>${s.name} · ${s.cefr}</h2><p class="small muted">12 вопросов. Для перехода на следующий этап нужно 70% и выше.</p></section><section class="card">${quizHTML("test",ui.test.qs)}</section><div id="testRes"></div>`}
after.stages=()=>{if(ui.test){const n=ui.test.n;regQuiz("test",ui.test.qs,sc=>{const prev=st.tests[n]?.best??0;st.tests[n]={best:Math.max(prev,sc),date:todayKey()};let msg="";if(sc>=70&&n===st.unlocked&&n<5){st.unlocked=n+1;msg="Открыт этап "+(n+1)+": "+STAGES[n].name+". Добавлены 20 слов, новые темы грамматики, тексты и задания."}else if(sc>=70&&n===5){msg="Вы прошли финальный этап. Уровень band 7.0 по материалам приложения."}else msg="Нужно 70%. Повторите темы этапа и попробуйте снова через пару дней.";save();$("#testRes").innerHTML=`<section class="card"><h3>Результат: ${sc}%</h3><p>${msg}</p><div class="row"><button class="btn" data-act="testBack">К дорожной карте</button></div></section>`;$("#testRes").scrollIntoView({behavior:"smooth"})})}};

/* --- Настройки --- */
function vSettings(){return `<section><h2>Настройки</h2></section>
 <section class="card"><div class="grid2"><label class="stat"><span class="small muted">Дата старта</span><input type="date" id="sStart" value="${st.start}"></label><label class="stat"><span class="small muted">Дата экзамена IELTS</span><input type="date" id="sExam" value="${st.exam}"></label></div>
 <label class="stat"><span class="small muted">Новых слов в день</span><select id="sNew">${[5,8,10,12].map(n=>`<option ${st.newPerDay===n?"selected":""}>${n}</option>`).join("")}</select></label>
 <div class="row"><button class="btn" data-act="saveSet">Сохранить</button></div></section>
 <section class="card"><h3>Резервная копия</h3><p class="small muted">Прогресс хранится в этом браузере. Скопируйте код, чтобы перенести его на другое устройство.</p><textarea id="bk" style="min-height:90px"></textarea><div class="row"><button class="btn soft" data-act="exp">Получить код</button><button class="btn ghost" data-act="imp">Загрузить код</button></div></section>
 <section class="card"><h3>Сброс прогресса</h3><p class="small muted">Удаляет все слова, результаты и историю.</p><div class="row"><button class="btn ghost" data-act="askReset">Сбросить всё</button></div></section>`}

/* ================= СОБЫТИЯ ================= */
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.classList.contains("opt"))return answer(t);
 if(t.dataset.say)return speak(t.dataset.say);
 if(t.dataset.go){ui.view=t.dataset.go;ui.test=null;return render()}
 if(t.dataset.wt){ui.wordsTab=t.dataset.wt;ui.card=null;return render()}
 if(t.dataset.dc){ui.dictCat=t.dataset.dc;return render()}
 if(t.dataset.gt){ui.gTopic=t.dataset.gt;return render()}
 if(t.dataset.ri){ui.rId=t.dataset.ri;return render()}
 if(t.dataset.si!=null){ui.sIdx=+t.dataset.si;return render()}
 if(t.dataset.test){ui.test={n:+t.dataset.test,qs:makeTest(+t.dataset.test)};return render()}
 const a=t.dataset.act;
 const A={
  startSession(){const av=availT(),i0=(dayIdx()*3)%av.length;ui.session={step:0,t0:Date.now(),topic:pickTopic(),read:pickReading(),trans:[0,1,2].map(i=>av[(i0+i)%av.length]),speakItem:availS()[dayIdx()%availS().length],warm:makeWarm()};render()},
  nextBlock(){const s=ui.session,d=day();const b=BLOCKS[s.step][0];if(!d.steps.includes(b))d.steps.push(b);if(b==="s")st.speak++;save();if(s.step<4){s.step++;render()}else{d.morning=true;save();ui.session=null;render();toast("Занятие завершено! Серия: "+streak()+" дн.")}},
  quitSession(){ui.session=null;render()},
  goWords(){ui.view="words";ui.wordsTab="today";render()},
  goReview(){ui.view="words";ui.wordsTab="review";render()},
  flip(){ui.card.open=true;render()},
  grade(){grade(ui.card.id,t.dataset.k==="1");ui.card=null;render()},
  addWord(){const en=$("#aEn").value.trim(),ru=$("#aRu").value.trim();if(!en||!ru)return toast("Заполните слово и перевод");st.custom.push({en,ru,ex:$("#aEx").value.trim()});const d=day();if(d.newWords.length<st.newPerDay+5)d.newWords.unshift("c-"+(st.custom.length-1));save();toast("Слово добавлено в слова дня");render()},
  gBack(){ui.gTopic=null;render()},rBack(){ui.rId=null;render()},
  checkTr(){checkTr(+t.dataset.i,ui.session?ui.session.trans:ui.trItems)},
  nextTr(){ui.tIdx++;render()},
  spTimer(){startSpTimer(+t.dataset.sec)},
  testBack(){ui.test=null;render()},
  saveSet(){st.start=$("#sStart").value||st.start;st.exam=$("#sExam").value||st.exam;st.newPerDay=+$("#sNew").value;save();toast("Сохранено");render()},
  exp(){const b=$("#bk");b.value=btoa(unescape(encodeURIComponent(JSON.stringify(st))));b.select();try{navigator.clipboard.writeText(b.value).then(()=>toast("Код скопирован"),()=>toast("Выделите и скопируйте код"))}catch(_){toast("Выделите и скопируйте код")}},
  imp(){try{st=Object.assign(defaults(),JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim())))));save();toast("Прогресс загружен");render()}catch(_){toast("Код не распознан. Проверьте, что он скопирован полностью.")}},
  askReset(){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><h3>Сбросить весь прогресс?</h3><p class="small muted">Это действие нельзя отменить.</p><div class="row"><button class="btn ghost" data-act="closeM">Отмена</button><button class="btn" data-act="doReset">Сбросить</button></div></div>`;document.body.appendChild(m)},
  closeM(){t.closest(".modal").remove()},
  doReset(){st=defaults();save();t.closest(".modal").remove();ui.view="today";render();toast("Прогресс сброшен")}
 };
 A[a]&&A[a]();
});
render();
</script>

</body>
</html>
